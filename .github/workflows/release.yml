name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: Lantharos/Sabine/.github/workflows/release-app.yml@7e1a8ad57903cef8e83bdc7859de9bb909a080d2
    with:
      sabine_version: v0.29
      rust_toolchain: "1.95"
      accept_wix_eula: true
      upgrade_from_sabine_version: v0.22
    secrets:
      SABINE_UPDATE_SIGNING_KEY: ${{ secrets.SABINE_UPDATE_SIGNING_KEY }}
