name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: Lantharos/Sabine/.github/workflows/release-app.yml@022b79f2fe7497e56b82378127fff1ae868f3e44
    with:
      sabine_version: v0.61
      rust_toolchain: "1.99"
      accept_wix_eula: true
      upgrade_from_sabine_version: v0.22
    secrets:
      SABINE_UPDATE_SIGNING_KEY: ${{ secrets.SABINE_UPDATE_SIGNING_KEY }}
