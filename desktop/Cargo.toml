[package]
name = "limbo"
version = "1.4.21"
edition = "2024"
rust-version = "1.98"
authors = ["Kristof <kristof@lanth.me>"]
description = "Limbo desktop host on Sabine"
license = "MIT"
publish = false

[[bin]]
name = "limbo"
path = "src/main.rs"

[lib]
name = "limbo_desktop"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
directories = "6.0.0"
futures-util = "0.3.34"
if-addrs = "0.15.0"
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
mime_guess = "2.0.5"
open = "5.4.5"
parking_lot = "0.13.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "multipart", "stream", "charset", "query", "form"] }
rfd = "0.17.2"
sabine = { git = "https://github.com/Lantharos/Sabine.git", tag = "v0.61" }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
sevenz-rust2 = "0.24.2"
specta = { version = "=2.0.0-rc.27", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "net", "process"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unrar = "0.5.8"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2", "deflate64", "bzip2", "lzma", "xz", "zstd"] }

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
