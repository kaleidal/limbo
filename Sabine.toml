[app]
id = "al.kaleid.limbo"
name = "Limbo"
publisher = "Kaleidal"
maintainer = "Kaleidal <hello@kaleid.al>"
version = "1.5.1"
icon = "public/icon.png"
cargo_manifest = "desktop/Cargo.toml"
generic_name = "Download Manager"
categories = ["Network", "FileTransfer", "P2P"]
keywords = ["torrent", "download", "magnet", "debrid", "bittorrent"]
mime_types = ["x-scheme-handler/magnet", "application/x-bittorrent"]

[web]
root = "."
dist = "web-dist"
entry = "web-dist/index.html"
dev_port = 5177
build = "bun run build"

[bindings]
path = "src/lib/bindings.ts"

[sandbox]
unsandboxed = true
reason = "It saves downloads to and opens files from any folder or drive you choose, and accepts torrent peers on your network."

[updates]
provider = "github"
repository = "kaleidal/limbo"
channel = "stable"
policy = "automatic"
public_key = "o1pDFQMTOdCASk1SfVCv1J5e7IOEctN2hDCpgTseMxk="
